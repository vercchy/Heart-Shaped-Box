# Local development services. Start with `pnpm db:up`, stop with `pnpm db:down`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: hsb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hsb
      POSTGRES_PASSWORD: hsb
      POSTGRES_DB: heart_shaped_box
    ports:
      # Host port 5433, because a local Postgres install already uses 5432.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hsb -d heart_shaped_box']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
